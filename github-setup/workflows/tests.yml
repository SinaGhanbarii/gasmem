# Runs the test suite and executes every notebook on each push and pull request.
# Results appear under the "Actions" tab on GitHub; the README badge shows the latest status.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab

jobs:
  pytest:
    name: tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install gasmem
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q

  notebooks:
    name: notebooks run without errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install gasmem with notebook tools
        run: python -m pip install -e ".[notebooks]" nbconvert ipykernel
      - name: Execute every notebook
        env:
          MPLBACKEND: Agg
        run: |
          mkdir -p executed
          for nb in notebooks/*.ipynb; do
            echo "::group::$nb"
            jupyter nbconvert --to notebook --execute "$nb" \
              --output-dir executed --ExecutePreprocessor.timeout=1200
            echo "::endgroup::"
          done
      - name: Keep the executed notebooks if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks
          path: executed/
